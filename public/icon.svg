<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5"/>
      <stop offset="100%" stop-color="#EFE8E1"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
  </defs>
  <!-- Background with subtle luxury border -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="464" height="464" rx="80" fill="none" stroke="#D4C7BA" stroke-width="4"/>
  
  <!-- Stylized Fragrance Silhouette -->
  <g transform="translate(196, 90)">
    <!-- Spray cap & nozzle -->
    <rect x="50" y="10" width="20" height="28" rx="4" fill="#1C1917"/>
    <rect x="42" y="38" width="36" height="18" rx="3" fill="url(#goldGrad)"/>
    <circle cx="60" cy="18" r="4" fill="#D97706"/>
    <!-- Bottle shoulders & body -->
    <path d="M 20 70 C 20 56, 100 56, 100 70 L 108 210 C 108 222, 12 222, 12 210 Z" fill="url(#goldGrad)" opacity="0.9"/>
    <!-- Inner highlight -->
    <path d="M 28 85 L 34 200" stroke="#FAF8F5" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
    <!-- Scent droplets -->
    <circle cx="20" cy="25" r="4" fill="#B45309" opacity="0.7"/>
    <circle cx="10" cy="12" r="3" fill="#D97706" opacity="0.5"/>
    <circle cx="100" cy="20" r="3.5" fill="#B45309" opacity="0.6"/>
  </g>

  <!-- Typography: AROMASS -->
  <text x="256" y="375" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="52" font-weight="700" letter-spacing="8" fill="#1C1917">
    AROMASS
  </text>
  <text x="256" y="415" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="600" letter-spacing="5" fill="#92400E">
    REVISTA DIGITAL
  </text>
  <line x1="180" y1="440" x2="332" y2="440" stroke="#D4C7BA" stroke-width="2"/>
</svg>
